# Copy this to ~/.dbt/profiles.yml (C:\Users\<you>\.dbt\profiles.yml on Windows)
# and set your real password there. Never commit the real file.
nem_pipeline:
  target: dev
  outputs:
    dev:
      type: postgres
      host: localhost
      port: 5432
      user: postgres
      password: change_me
      dbname: nem_data
      schema: analytics
      threads: 4